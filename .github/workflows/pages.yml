name: pages
on:
  push:
    branches: [main]
    paths: ["packages/lessons/**", "docs-site/**"]
permissions:
  pages: write
  id-token: write
  contents: read
environment:
  name: github-pages
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - id: stack
        uses: actions/configure-pages@v5
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd docs-site && node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist
      - uses: actions/deploy-pages@v4
