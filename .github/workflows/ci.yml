name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }
      - name: instalar dependencias
        run: npm ci --include-workspace-root
      - name: typecheck de workspaces
        run: |
          for ws in packages/shared apps/sandbox-server apps/web; do
            (cd "$ws" && npx tsc --noEmit -p tsconfig.json)
          done
      - name: tests (vitest)
        run: npm test --workspaces --if-present -- --run
      - name: lint (shellcheck + lessons)
        run: |
          sudo apt-get install -y -qq shellcheck >/dev/null
          ./scripts/lint.sh
      - name: docs-site
        run: (cd docs-site && node scripts/build.mjs && test -f dist/index.html)
