services:
  sandbox:
    build:
      context: ..
      dockerfile: docker/sandbox.Dockerfile
    container_name: ${STACK_PREFIX:-bashforge}-sandbox
    environment:
      PORT: "8010"
      LESSONS_DIR: /opt/bashforge/lessons
      # volúmenes persistentes de progreso y homes del alumno
      PROGRESS_DIR: /data/progress
      HOME_ROOT: /data/homes
    volumes:
      - sandbox-data:/data
    ports:
      - "${SANDBOX_PORT:-8010}:8010"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8010/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    container_name: ${STACK_PREFIX:-bashforge}-web
    depends_on:
      - sandbox
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  sandbox-data:
