id: lvl2-lab-operador
title: Laboratorio interactivo · Operator Lab
level: 2
kind: challenge
xp: 40
estimated_minutes: 10
prerequisites:
  - lvl2-case-esac
tags:
  - lab
  - condicionales
objective: Confeccionar tu propio tester de operadores de test sobre ficheros.
files_to_create:
  - operador.sh
validation:
  mode: declarative
  timeout_seconds: 30
  tasks:
    - name: lab-f
      message: "bash operador.sh -f vars.sh imprime 'TEST -f: ok'"
      cmd: bash operador.sh -f vars.sh
      expectOutput: "^TEST -f: ok$"
    - name: lab-d
      message: "bash operador.sh -d workspace imprime 'TEST -d: ok'"
      cmd: bash operador.sh -d workspace
      expectOutput: "^TEST -d: ok$"
    - name: lab-desconocido
      message: "bash operador.sh -Z fichero imprime 'TEST -Z: desconocido'"
      cmd: bash operador.sh -Z workspace
      expectOutput: "^TEST -Z: desconocido$"
