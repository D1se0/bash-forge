id: lvl2-ops-ficheros
title: "La tabla de ficheros: -e -f -d -r -w -x -s y la cuña"
level: 2
kind: lesson
xp: 25
estimated_minutes: 8
prerequisites:
  - lvl2-if-test
tags:
  - condicionales
  - ficheros
objective: Distinguir existencia, tipo, permisos y tamaño con test de ficheros.
files_to_create: []
validation:
  mode: declarative
  timeout_seconds: 30
  tasks:
    - name: fichero-con-contenido
      message: sobre un fichero con datos imprime 'FICHERO'
      cmd: mkdir -p .fx && echo dato > .fx/saludo.txt && bash es-papel.sh .fx/saludo.txt
      expectOutput: ^FICHERO$
    - name: directorio
      message: sobre un directorio imprime 'CARPETA'
      cmd: mkdir -p .fx/workspace-que-si-existe && bash es-papel.sh .fx/workspace-que-si-existe
      expectOutput: ^CARPETA$
    - name: fantasma
      message: sobre algo inexistente imprime 'FANTASMA'
      cmd: bash es-papel.sh .fx/nada-de-nadie.txt
      expectOutput: ^FANTASMA$
