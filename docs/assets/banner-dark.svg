<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="abyss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e222a"/>
      <stop offset="1" stop-color="#2e3440"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fbcbb"/>
      <stop offset=".35" stop-color="#81a1c1"/>
      <stop offset=".7" stop-color="#b48ead"/>
      <stop offset="1" stop-color="#a3be8c"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d08770"/>
      <stop offset="1" stop-color="#ebcb8b"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#abyss)"/>

  <!-- siluetas de montañas -->
  <path d="M0 250 L180 170 L320 240 L470 150 L640 250 L1280 250 L1280 320 L0 320 Z" fill="#242933"/>
  <path d="M0 285 L240 210 L410 280 L590 200 L760 285 L1280 230 L1280 320 L0 320 Z" fill="#22262f"/>

  <!-- aurora -->
  <path d="M-40 40 C 240 -30 420 120 640 40 C 860 -40 1060 110 1320 30 L1320 130 C 1060 210 860 60 640 140 C 420 220 240 70 -40 140 Z"
        fill="url(#aurora)" opacity=".22" filter="url(#blur)"/>

  <!-- cenefa de nudos superior -->
  <g stroke="#4c566a" stroke-width="2" opacity=".55">
    <path d="M0 18 H1280" stroke-dasharray="4 8"/>
    <path d="M0 24 H1280" stroke="#81a1c1" stroke-dasharray="2 10" opacity=".7"/>
  </g>

  <!-- yunque + kenaz -->
  <g transform="translate(120,120)">
    <path d="M0 44 H96 C116 44 130 55 136 66 C127 69 115 71 101 71 H90 L93 85 C109 90 118 99 121 108 H9 C13 99 21 90 45 85 L50 71 H24 C7 71 4 55 0 44 Z" fill="#4c566a"/>
    <circle cx="68" cy="56" r="17" fill="#2e3440"/>
    <path d="M84 34 L52 57 L86 81" stroke="url(#ember)" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- título y lema -->
  <text x="300" y="168" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" fill="#eceff4" letter-spacing="2">BASH FORGE</text>
  <text x="304" y="216" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#d8dee9" letter-spacing="1">La forja bajo la aurora — aprende Bash forjando scripts de verdad</text>
  <text x="304" y="252" font-family="monospace" font-size="17" fill="#88c0d0">82 lecciones · 7 retos · 5 Boss Fights · terminal real en Ubuntu</text>

  <!-- sigilo: runas laterales -->
  <g fill="#4c566a" font-family="monospace" font-size="34" opacity=".8">
    <text x="1160" y="120">ᚠ</text><text x="1160" y="158">ᚢ</text><text x="1160" y="196">ᚦ</text>
  </g>
</svg>
